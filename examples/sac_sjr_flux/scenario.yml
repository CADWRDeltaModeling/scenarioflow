# =========================
# minimal scenario schema
# =========================
define:
  session_start: 2025-04-01
  session_end:   2025-12-31
  forecast_start: 2025-05-01
  transition_start: 2025-05-01
  transition_end: 2025-05-04
  end: 2025-12-31
  model_unit: "m^3/s"
  forecast_file: "forecast.csv"
  flux_dt: "15min"

scenario:
  name: flux

  # Applies to all series unless overridden in that series block
  defaults:
    dt_target: ${flux_dt}
    stitcher:
      name: ts_splice
      args: {}          # e.g., duplicate_keep/floor_dates if you want; otherwise empty

  # Optional canonical window for loaders/clipping (use explicitly; no magic)
  window:
    start: ${session_start}
    end:   ${session_end}

  series:
    - name: sac
      stitcher:
        name: ts_splice
        args: {names: 'sac'} 
      components:
        - name: hist
          type: data
          effective: ${session_start}
          load_method:
            name: read_ts_repo
            args:
              station_id: fpt
              variable: flow
              start: 2025-03-01
              # sublocation: <optional>
          transformations:
            - name: unit_conversion
              args: { from_unit: "ft^3/s", to_unit: "m^3/s" }
            - name: rename_columns
              args: { colnames: "sac" }
        - name: hist_forecast_transition
          type: function
          method: transition_ts
          args:
            ts0: $!{hist}
            ts1: $!{forecast}
            method: pchip
            overlap: ["1d", "1d"]
            return_type: glue
            window: 
              - ${transition_start}
              - ${transition_end}
          effective: ${transition_start}
        - name: forecast
          type: data
          load_method:
            name: read_ts
            source: ${forecast_file}
            args:
              selector: sac
          transformations:
            - name: unit_conversion
              args: { from_unit: "ft^3/s", to_unit: "m^3/s" }
            - name: rhistinterp
              args: { dest: "${flux_dt}", p: 10 }
          effective: ${transition_end}
        - name: climatology
          type: data
          effective: $!{forecast.last_valid_index()}
          load_method:
            name: read_climatology
            source: "sac_climate.csv"
            #usecols: ['day','sac']
            #names: ['day','sac']
            header_col: 0
          transformations:
            - name: apply_climatology
              args:
                start: $!{forecast.last_valid_index() - days(2)}
                end: ${session_end}
                freq: ${flux_dt}
            - name: unit_conversion
              args: { from_unit: "ft^3/s", to_unit: "m^3/s" }
            - name: rename_columns
              args: { colnames: "sac" }

    # -------- series B (another independent output) --------
    - name: sjr
      components:
        - name: hist
          type: data
          effective: ${session_start}
          load:
            name: read_ts_repo
            args:
              start: 2025-03-01
              station_id: vns
              variable: flow
          transformations:
            - name: unit_conversion
              args: { from_unit: "ft^3/s", to_unit: "m^3/s" }          
            - name: rename_columns
              args: { colnames: "sjr" }
        - name: hist_forecast_transition
          type: function
          method: transition_ts
          args:
            ts0: $!{hist}
            ts1: $!{forecast}
            method: pchip
            overlap: ["1d", "1d"]
            return_type: glue
            window: 
              - ${transition_start}
              - ${transition_end}
          effective: ${transition_start}
        - name: forecast
          type: data
          load_method:
            name: read_ts
            source: ${forecast_file}
            args:
              selector: sjr
          transformations:
            - name: unit_conversion
              args: { from_unit: "ft^3/s", to_unit: "m^3/s" }
            - name: rhistinterp
              args: { dest: "${flux_dt}", p: 10 }
          effective: ${transition_end}
        - name: forecast_extrapolation
          type: function
          method: extrapolate_ts
          args:
            ts: $!{forecast}
            start: $!{forecast.last_valid_index()}
            end: ${session_end}
            method: ffill
          effective: $!{forecast.last_valid_index()}
