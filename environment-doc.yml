# Documentation-support overlay; run these commands from the repository root.
# Requires conda >=26.3.0 (the conda installation normally lives in base).
# conda create -n scenarioflow_doc --format cep-24 --file environment.yml --file environment-doc.yml
# Older conda: create from environment.yml, then add this overlay without --prune.
# conda env create -n scenarioflow_doc -f environment.yml
# conda env update -n scenarioflow_doc -f environment-doc.yml
# conda activate scenarioflow_doc
# python -m pip install --no-deps -e .
# sphinx-build -b html docsrc docs/html

channels:
  - conda-forge
  - nodefaults
dependencies:
  - pip
  - sphinx>=7.0,<9
  - sphinx-rtd-theme
  - sphinx-click
  - sphinx-design
  - sphinxcontrib-mermaid
  - myst-parser
  - numpydoc
  - ghp-import
  - docutils
  - pandoc
